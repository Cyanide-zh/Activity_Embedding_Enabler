pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    // 强制所有模块统一管理仓库源
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Xposed 官方 API 相关的 maven 仓库源
        maven { url 'https://api.xposed.info/' }
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "ActivityEmbeddingHook"
include ':app'
